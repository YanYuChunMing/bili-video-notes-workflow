services:
  backend:
    build: .
    image: bili-video-notes:dev
    container_name: bili-video-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./src:/app/src
      - ./web:/app/web
      - ./main.py:/app/main.py
      - ./config.toml:/app/config.toml:ro
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: bili-video-frontend:dev
    container_name: bili-video-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
    depends_on:
      - backend
